<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Account Suspension Notice</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(#0b0f1a, #111);
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .panel {
      width: 420px;
      background: #1a1d2b;
      border-radius: 6px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }

    .title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .section {
      margin-bottom: 14px;
    }

    .label {
      font-size: 13px;
      color: #b0b0b0;
    }

    .value {
      font-size: 14px;
      margin-top: 3px;
    }

    .offense {
      background: #141624;
      padding: 10px;
      border-radius: 4px;
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
    }

    .note {
      font-size: 12px;
      color: #bcbcbc;
      margin-top: 12px;
    }

    .logout {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: #2c2f45;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .logout:hover {
      background: #3a3e5e;
    }

    .fake {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="title">BANNED FOR NGU VC</div>

    <div class="section">
      <div class="label">Reason</div>
      <div class="value">Harassment</div>
    </div>

    <div class="section">
      <div class="label">Offensive Item</div>
      <div class="offense">
        kêu cái gì<br>
        óc cặc thì phải chịu<br>
      </div>
    </div>

    <div class="section">
      <div class="label">Account Status</div>
      <div class="value">
        Your account has been temporarily suspended due to repeated violations.
      </div>
    </div>

    <div class="note">
      Please follow the community rules so everyone can enjoy the platform.
      <br><br>
      Reactivation Date:<br>
    </div>

    <button class="logout" onclick="alert('Bị troll rồi =))')">
      Log Out
    </button>

    <div class="fake">
    </div>
  </div>
</body>
</html>
